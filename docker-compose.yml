services:
  db:
    image: postgres:17-alpine
    container_name: frigorifico-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: frigorifico
      POSTGRES_PASSWORD: frigorifico
      POSTGRES_DB: frigorifico
      TZ: America/Argentina/Buenos_Aires
    ports:
      - '5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U frigorifico -d frigorifico']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
